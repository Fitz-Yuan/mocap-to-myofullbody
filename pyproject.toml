[project]
name = "mocap2myo"
version = "0.1.0"
description = "Optical motion capture (OptiTrack takes, C3D, TRC; Plug-in-Gait markers) to MyoFullBody musculoskeletal motions"
readme = "README.md"
license = { text = "Apache-2.0 for the code; the model files in mocap2myo/assets/myofullbody are under their own LICENSE and NOTICE (arm and hand parts: non-commercial use only)" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mujoco==3.11.0",
                "tomli>=1.1; python_version < '3.11'"]  # dataset profiles (tomllib from 3.11)

[project.optional-dependencies]
tak = ["olefile>=0.46"]      # reading OptiTrack .tak files
c3d = ["ezc3d>=1.5"]         # reading C3D files (markers, force plates, analog channels)
xsens = ["ezc3d>=1.5"]       # Xsens c3d comparison
gpu = ["torch>=2.1", "warp-lang>=1.0"]   # the GPU IK (M2M_IK_DEVICE=gpu): CUDA torch and NVIDIA Warp
# The OpenSim baseline (pipeline/validate/opensim_ik.py) needs the opensim package from conda:
#   conda install -c opensim-org opensim

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mocap2myo"]
