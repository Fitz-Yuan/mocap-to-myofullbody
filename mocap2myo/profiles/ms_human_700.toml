title = "MS-Human-700: full body, 700 muscles"
license = "Apache-2.0 (MS-Human-700 repository LICENSE)"
sources = ["ms_human_700"]

[model]
xml = "ms_human_700/src/MS-Human-700.xml"

[root]
body = "pelvis"         # pelvis_tx ... pelvis_rotation (3 slides, 3 hinges) -> one free joint "root"
replace = ["pelvis_tz", "pelvis_ty", "pelvis_tx", "pelvis_tilt", "pelvis_list", "pelvis_rotation"]

[frame]
up = "+z"
forward = "+x"          # the pelvis body is turned +90 deg about x (OpenSim y-up frames in a z-up world)

[neutral]
keyframe = "init"

[ik]
include = ["*"]         # every joint not driven by an equality (shoulder rhythm, knee, patella, wrist)
mtp = ["mtp_angle_r", "mtp_angle_l"]          # pulled toward neutral (M2M_MTP_PRIOR): no marker on the toes
static_neutral = ["hip_flexion_r", "hip_adduction_r", "hip_rotation_r", "knee_angle_r", "ankle_angle_r", "subtalar_angle_r",
                  "hip_flexion_l", "hip_adduction_l", "hip_rotation_l", "knee_angle_l", "ankle_angle_l", "subtalar_angle_l"]
smooth_heavy = ["ankle_angle*", "subtalar*"]          # smoothed harder (ik_trial ankle_smooth)
smooth_gated = { elv_angle_r = "shoulder_elv_r", elv_angle_l = "shoulder_elv_l" }

[angles]   # name -> [joint, sign]: positive = the named motion
knee_flex_r = ["knee_angle_r", 1]
hip_flex_r = ["hip_flexion_r", 1]
hip_add_r = ["hip_adduction_r", 1]
ankle_dorsi_r = ["ankle_angle_r", 1]
knee_flex_l = ["knee_angle_l", 1]
hip_flex_l = ["hip_flexion_l", 1]
hip_add_l = ["hip_adduction_l", 1]
ankle_dorsi_l = ["ankle_angle_l", 1]
lumbar_ext = ["L5_S1_FE", 1]
shoulder_elv_r = ["shoulder_elv_r", 1]
shoulder_elv_l = ["shoulder_elv_l", 1]
elbow_flex_r = ["elbow_flexion_r", 1]
elbow_flex_l = ["elbow_flexion_l", 1]

[segments]
pelvis = ["pelvis", "sacrum"]
# T12 carries the T12/L1 joint; T11..T1, the sternum and the ribs are rigid on it
torso = ["thoracic12", "thoracic11", "thoracic10", "thoracic9", "thoracic8", "thoracic7", "thoracic6",
         "thoracic5", "thoracic4", "thoracic3", "thoracic2", "thoracic1", "sternum",
         "rib1_L", "rib1_R", "rib2_L", "rib2_R", "rib3_L", "rib3_R", "rib4_L", "rib4_R", "rib5_L", "rib5_R",
         "rib6_L", "rib6_R", "rib7_L", "rib7_R", "rib8_L", "rib8_R", "rib9_L", "rib9_R", "rib10_L", "rib10_R",
         "rib11_L", "rib11_R", "rib12_L", "rib12_R"]
# head and cervical spine are one body (T1_head_neck joint)
neck = { bodies = ["head_neck"], geoms = ["*cerv*"] }
head = { bodies = ["head_neck"], exclude_geoms = ["*cerv*"] }
femur_l = ["femur_l"]
femur_r = ["femur_r"]
tibia_l = ["tibia_l"]
tibia_r = ["tibia_r"]
foot_l = ["calcn_l"]
foot_r = ["calcn_r"]
toes_l = ["toes_l"]
toes_r = ["toes_r"]
clavicle_l = ["clavicle_l"]
clavicle_r = ["clavicle_r"]
scapula_l = ["scapula_l"]
scapula_r = ["scapula_r"]
humerus_l = ["humerus_l"]
humerus_r = ["humerus_r"]
ulna_l = ["ulna_l"]
ulna_r = ["ulna_r"]
radius_l = ["radius_l"]
radius_r = ["radius_r"]
hand_l = ["hand_l"]     # metacarpals + distal carpals; the proximal row is its own body (wrist joints)
hand_r = ["hand_r"]

[joint_centres]
hip_l = "jnt:hip_flexion_l"
hip_r = "jnt:hip_flexion_r"
knee_l = "jnt:knee_angle_l"
knee_r = "jnt:knee_angle_r"
ankle_l = "jnt:ankle_angle_l"
ankle_r = "jnt:ankle_angle_r"
mtp_l = "jnt:mtp_angle_l"
mtp_r = "jnt:mtp_angle_r"
shoulder_l = "jnt:shoulder_rot_l"
shoulder_r = "jnt:shoulder_rot_r"
elbow_l = "jnt:elbow_flexion_l"
elbow_r = "jnt:elbow_flexion_r"
wrist_l = "jnt:flexion_l"
wrist_r = "jnt:flexion_r"
lumbar = "jnt:L5_S1_FE"

[landmarks]
c7 = { bodies = ["head_neck"], geoms = ["rotatedcerv7*"], band = false }
t10 = { bodies = ["thoracic10"], band = false }
mc3_head = { geoms = ["*_3mc*"] }
mc2_head = { geoms = ["*_2mc*"] }
mc5_head = { geoms = ["*_5mc*"] }

# "anat:<direction>": a direction of the canonical frame (anterior, posterior, superior, inferior,
# left, right) fixed in the frame body at the neutral pose (phase 2: kinetics reads it so)
[kinetics.L5S1]
distal = "lumbar5"
point = "jnt:L5_S1_FE"
frame = "lumbar5"
comps = [["ext", "anat:right", 1], ["latbend", "anat:anterior", 1], ["twist", "anat:superior", 1]]
# the trunk axes of the compression / shear (default y / x): lumbar5 is tilted ~21 deg at neutral
superior = "anat:superior"
anterior = "anat:anterior"
[kinetics.shoulder_r]
distal = "humerus_r"
point = "jnt:shoulder_rot_r"
frame = "thoracic1"
comps = [["flex", "anat:right", 1], ["abd", "anat:anterior", -1]]
[kinetics.shoulder_l]
distal = "humerus_l"
point = "jnt:shoulder_rot_l"
frame = "thoracic1"
comps = [["flex", "anat:right", 1], ["abd", "anat:anterior", 1]]
[kinetics.elbow_r]
distal = "ulna_r"
point = "jnt:elbow_flexion_r"
frame = "ulna_r"
comps = [["flex", "jnt:elbow_flexion_r", 1]]
[kinetics.elbow_l]
distal = "ulna_l"
point = "jnt:elbow_flexion_l"
frame = "ulna_l"
comps = [["flex", "jnt:elbow_flexion_l", 1]]
[kinetics.hip_r]
distal = "femur_r"
point = "jnt:hip_flexion_r"
frame = "pelvis"
comps = [["ext", "jnt:hip_flexion_r", -1], ["abd", "jnt:hip_adduction_r", -1]]
[kinetics.hip_l]
distal = "femur_l"
point = "jnt:hip_flexion_l"
frame = "pelvis"
comps = [["ext", "jnt:hip_flexion_l", -1], ["abd", "jnt:hip_adduction_l", -1]]
[kinetics.knee_r]
distal = "tibia_r"
point = "jnt:knee_angle_r"
frame = "tibia_r"
comps = [["ext", "jnt:knee_angle_r", -1]]
[kinetics.knee_l]
distal = "tibia_l"
point = "jnt:knee_angle_l"
frame = "tibia_l"
comps = [["ext", "jnt:knee_angle_l", -1]]
[kinetics.ankle_r]
distal = "talus_r"
point = "jnt:ankle_angle_r"
frame = "tibia_r"
comps = [["plantar", "jnt:ankle_angle_r", -1]]
[kinetics.ankle_l]
distal = "talus_l"
point = "jnt:ankle_angle_l"
frame = "tibia_l"
comps = [["plantar", "jnt:ankle_angle_l", -1]]

[contact]
sole_bodies = { l = ["calcn_l", "toes_l"], r = ["calcn_r", "toes_r"] }
sole_geoms = "collision"
sole_geom_types = ["capsule"]
palm_body = { l = "hand_l", r = "hand_r" }
